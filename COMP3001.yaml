about_course:
  - content: "两位老师虽然风格迥异，但是并不影响考试的公平性——因为考试考得基本跟上课关系不太大。"
    submitter:
      name: ""
      link: ""
  - content: |
      实验大多基于Linux。
      2018级的前四个实验选用了基于MIT6.828/6.S081（2019）课程的XV6作为实验平台，完成一些指定任务；最后一个实验需要设计一个文件系统。每年的实验都*不太一样*。
      操作系统的实验都比较困难，因而需要花费比较长的时间。
      最后一节实验课会进行课堂检查，会要求现场改代码、解读代码等等，所以需要做好应对之策。
    submitter:
      name: ""
      link: ""
